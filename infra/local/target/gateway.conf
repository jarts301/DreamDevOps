# The local target's one door to the platform. Pods in k3s can't resolve Docker's
# service names, so the target network reaches everything at platform.internal, a fixed
# address that this gateway answers.

# Forgejo names localhost:3000 in its registry's sign-in address, which means the pod
# itself inside k3s. This puts the gateway's own address there instead.
map $upstream_http_www_authenticate $target_www_authenticate {
  "~^(?<before>.*)http://localhost:[0-9]+(?<after>.*)$" "${before}http://platform.internal:3000${after}";
  default $upstream_http_www_authenticate;
}

server {
  listen 3000;
  client_max_body_size 0;
  location / {
    proxy_pass http://forgejo:3000;
    proxy_set_header Host $http_host;
    proxy_hide_header WWW-Authenticate;
    add_header WWW-Authenticate $target_www_authenticate always;
    proxy_buffering off;
  }
}

# OpenBao, where the External Secrets Operator reads this environment's secrets.
server {
  listen 8200;
  location / {
    proxy_pass http://openbao:8200;
  }
}

# The API on your machine, for the agent.
server {
  listen 4000;
  client_max_body_size 1m;
  location / {
    proxy_pass http://host.docker.internal:4000;
    proxy_set_header Host $http_host;
  }
}
