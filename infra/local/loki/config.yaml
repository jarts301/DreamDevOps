# Loki keeps the logs clusters send over OTLP, through the platform's collector, on this
# machine's disk, for LOKI_RETENTION. One process does everything, as suits one machine.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 360h
  # Where each line comes from, as labels, so the API can ask for one place's lines:
  # dreamdevops_place_id and so on. Other attributes are kept with each line.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - dreamdevops.place.id
            - dreamdevops.environment.id
            - dreamdevops.application.id
            - dreamdevops.company.id

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
