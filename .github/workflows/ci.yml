# Checks every push and pull request: lint, types, unit tests with coverage, the build, the
# types and unit tests again on Windows, and the integration tests against throwaway
# containers. The browser test and the blueprint scaffold test need the whole local stack,
# so they stay manual, as the README describes.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The API, the shared kernel and the contracts, with coverage, which must not drop below its thresholds.
      - run: npm run test:coverage
      - run: npm run test:unit -w @dreamdevops/agent -w @dreamdevops/dashboard
      - run: npm run build
      - name: Keep the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage/
            packages/shared-kernel/coverage/
            packages/contracts/coverage/
          if-no-files-found: ignore

  # The same types and unit tests on Windows, where paths use backslashes and Git checks
  # files out with CRLF line endings, as on the machines some people develop on.
  windows:
    name: Types and unit tests on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Real PostgreSQL, Keycloak, Forgejo and the others, in containers that Docker on the runner starts.
      - run: npm run test:integration
