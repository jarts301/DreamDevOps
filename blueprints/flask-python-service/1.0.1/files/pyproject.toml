[project]
name = "__APP_SLUG__"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.3",
  "waitress>=3.0.2",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-flask>=0.66b1",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "mypy>=2.4.1", "types-waitress>=3.0.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Errors, mistakes, imports, bugbear, newer syntax, simpler code and names.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["service", "tests"]

[tool.mypy]
strict = true
files = ["service", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
