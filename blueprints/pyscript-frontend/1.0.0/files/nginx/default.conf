# Serves the built app. Runs as a non-root user on port 8080.

# Each request is logged as one line of JSON on standard output, where the platform reads
# it. A request that arrives with a W3C traceparent header, such as from a service that
# passes its trace on, is logged with it, so the line shows beside the trace.
log_format json escape=json
  '{"time":"$time_iso8601","level":"info","msg":"$request_method $uri $status",'
  '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"request_id":"$request_id","traceparent":"$http_traceparent",'
  '"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log json;

  include /etc/nginx/snippets/security-headers.conf;

  # The platform checks this to decide whether to restart the container.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Written at startup from environment variables. See write-runtime-config.sh.
  location = /config.json {
    alias /tmp/runtime-config/config.json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # PyScript and Pyodide, in folders named after their versions, so they can be cached for a
  # long time. Browsers only run modules and WebAssembly served with these types.
  location ^~ /vendor/ {
    types {
      text/javascript js mjs;
      text/css css;
      application/wasm wasm;
      application/json json;
      application/zip zip;
    }
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The app's Python and PyScript's settings, which the page loads as it starts. They change
  # with each version, so browsers check for a newer one. A missing file is a 404, not the page.
  location ~* \.py$ {
    default_type text/x-python;
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /pyscript.json {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # File names include a content hash, so they can be cached for a long time.
  location ~* \.(?:js|css|woff2?)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Every other path loads the app, which handles its own routes.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
