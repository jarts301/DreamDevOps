[project]
name = "__APP_SLUG__"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.162",
    "psycopg[binary]>=3.3",
    "sqlalchemy>=2.1",
    "uvicorn>=0.54",
]

[project.scripts]
app = "app.main:run"
migrate = "app.migrate:run"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# A new migration imports op and sa before it uses them.
"src/app/migrations/versions/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
