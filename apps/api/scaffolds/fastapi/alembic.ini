# For Alembic's own commands, such as: uv run alembic revision -m "add a table"
# The database comes from DATABASE_URL. To apply migrations, run: uv run migrate
[alembic]
script_location = src/app/migrations
file_template = %%(rev)s_%%(slug)s

# New migrations are formatted and tidied, so they pass lint as soon as they exist.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
