[project]
name = "__APP_SLUG__"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.66",
]

[project.scripts]
app = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Streamlit's charts use a pandas feature that pandas plans to remove. Only that
    # warning, from Streamlit itself, is hidden, so warnings from this app still show.
    "ignore:The inplace keyword in DataFrame.reset_index is deprecated:Warning:streamlit",
]
